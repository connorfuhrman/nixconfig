steps:
  # No branch `if`: Cloud Agents push the feature branch before the PR exists,
  # so pull_request.base_branch is empty and a gate on main/develop skips this
  # step. skip_pull_request_builds_for_existing_commits then blocks a redo.
  - label: ":nix: flake check"
    key: flake-check
    command: .buildkite/scripts/flake-check.sh
    plugins:
      - docker#v5.14.0:
          image: "nixos/nix:2.28.2"
          mount-checkout: true
          propagate-environment: true
          environment:
            - "NIX_CONFIG=experimental-features = nix-command flakes"
    agents:
      queue: linux-medium
    timeout_in_minutes: 90
    retry:
      automatic:
        - exit_status: "*"
          limit: 1
