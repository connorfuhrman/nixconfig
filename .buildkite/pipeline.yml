# Shared fragments. Buildkite expands YAML anchors / merge keys at upload.
x-branch-if: &branch-if
  if: |
    build.branch == "main" ||
    build.pull_request.base_branch == "main"

x-mac-mini-macos: &mac-mini-macos
  agents:
    queue: mac-mini-macos

x-timeout-retry: &timeout-retry
  timeout_in_minutes: 180
  retry:
    automatic:
      - exit_status: "*"
        limit: 1

# Four sequential steps on the mac-mini-macos queue. No docker-plugin steps
# in this pipeline (the queue itself remains a docker runner for other repos)
# and no hosted queue. Each step depends_on the previous one so eval-heavy
# jobs never run concurrently on the 16 GiB host (two ~8 GiB evals + the
# Podman and linux-builder VMs would oversubscribe RAM).
steps:
  - label: ":nix: nix fmt --check"
    key: nix-fmt-check
    command: nix fmt . -- --check
    <<: [*branch-if, *mac-mini-macos]

  - group: ":mac: mac-mini-macos CI"
    key: mac-mini-macos-ci
    depends_on: "nix-fmt-check"
    <<: *branch-if
    steps:
      - label: ":nix: flake check"
        key: flake-check-mac-mini-macos
        command: .buildkite/scripts/flake-check.sh
        <<: [*mac-mini-macos, *timeout-retry]

      - label: ":package: build packages"
        key: build-packages-mac-mini-macos
        command: .buildkite/scripts/build-packages.sh
        depends_on: flake-check-mac-mini-macos
        <<: [*mac-mini-macos, *timeout-retry]

      - label: ":apple: build darwin closures (aarch64-darwin)"
        key: build-darwin-mac-mini-macos
        command: .buildkite/scripts/build-darwin.sh
        depends_on: build-packages-mac-mini-macos
        <<: [*mac-mini-macos, *timeout-retry]

      - label: ":house: build home-manager (aarch64-darwin)"
        key: build-home-darwin-mac-mini-macos
        command: .buildkite/scripts/build-home-darwin.sh
        depends_on: build-darwin-mac-mini-macos
        <<: [*mac-mini-macos, *timeout-retry]
