# Shared fragments. Buildkite expands YAML anchors / merge keys at upload.
x-branch-if: &branch-if
  if: |
    build.branch == "main" ||
    build.pull_request.base_branch == "main"

x-mac-mini-macos: &mac-mini-macos
  agents:
    queue: mac-mini-macos

x-timeout-retry: &timeout-retry
  timeout_in_minutes: 180
  retry:
    automatic:
      - exit_status: "*"
        limit: 1

steps:
  - label: ":nix: nix fmt --check"
    key: nix-fmt-check
    command: .buildkite/scripts/nix-fmt-check.sh
    <<: [*branch-if, *mac-mini-macos]

  - group: ":mac: mac-mini-macos CI"
    key: mac-mini-macos-ci
    depends_on: "nix-fmt-check"
    <<: *branch-if
    steps:
      - label: ":nix: flake check (native macOS)"
        key: flake-check-mac-mini-macos
        command: .buildkite/scripts/flake-check.sh
        <<: [*mac-mini-macos, *timeout-retry]

      - label: ":docker: flake check (container / Podman)"
        key: flake-check-mac-mini-container
        command: .buildkite/scripts/flake-check.sh
        plugins:
          - docker#v5.14.0:
              image: "nixos/nix:2.28.2"
              mount-checkout: true
              propagate-environment: true
              environment:
                - "NIX_CONFIG=experimental-features = nix-command flakes"
        <<: [*mac-mini-macos, *timeout-retry]

      - label: ":package: build packages"
        key: build-packages-mac-mini-macos
        command: .buildkite/scripts/build-packages.sh
        <<: [*mac-mini-macos, *timeout-retry]

      - label: ":nixos: build nixos (rpi-cluster-head)"
        key: build-nixos-rpi-cluster-head
        command: .buildkite/scripts/build-nixos.sh
        <<: [*mac-mini-macos, *timeout-retry]

  - label: ":nix: flake check (hosted backup)"
    key: flake-check-hosted-linux-medium
    depends_on: "nix-fmt-check"
    <<: *branch-if
    soft_fail: true
    command: .buildkite/scripts/flake-check.sh
    plugins:
      - docker#v5.14.0:
          image: "nixos/nix:2.28.2"
          mount-checkout: true
          propagate-environment: true
          environment:
            - "NIX_CONFIG=experimental-features = nix-command flakes"
    agents:
      queue: linux-medium
    timeout_in_minutes: 90
    retry:
      automatic:
        - exit_status: "*"
          limit: 1
